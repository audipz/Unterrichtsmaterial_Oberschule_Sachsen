<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
<rect width="1000" height="420" fill="white"/>
<rect x="40" y="60" width="250" height="210" fill="white" stroke="black" stroke-width="2"/>
<text x="60" y="92" font-size="24" font-family="sans-serif">Besucher</text>
<line x1="40" y1="110" x2="290" y2="110" stroke="black"/>
<text x="60" y="145" font-size="18" font-family="sans-serif">PK besucher_id</text>
<text x="60" y="180" font-size="18" font-family="sans-serif">vorname</text>
<text x="60" y="215" font-size="18" font-family="sans-serif">nachname</text>
<text x="60" y="250" font-size="18" font-family="sans-serif">email</text>

<rect x="375" y="60" width="250" height="245" fill="white" stroke="black" stroke-width="2"/>
<text x="395" y="92" font-size="24" font-family="sans-serif">Ticket</text>
<line x1="375" y1="110" x2="625" y2="110" stroke="black"/>
<text x="395" y="145" font-size="18" font-family="sans-serif">PK ticket_id</text>
<text x="395" y="180" font-size="18" font-family="sans-serif">FK besucher_id</text>
<text x="395" y="215" font-size="18" font-family="sans-serif">FK veranstaltung_id</text>
<text x="395" y="250" font-size="18" font-family="sans-serif">kaufdatum</text>
<text x="395" y="285" font-size="18" font-family="sans-serif">status</text>

<rect x="710" y="60" width="250" height="210" fill="white" stroke="black" stroke-width="2"/>
<text x="730" y="92" font-size="24" font-family="sans-serif">Veranstaltung</text>
<line x1="710" y1="110" x2="960" y2="110" stroke="black"/>
<text x="730" y="145" font-size="18" font-family="sans-serif">PK veranstaltung_id</text>
<text x="730" y="180" font-size="18" font-family="sans-serif">titel</text>
<text x="730" y="215" font-size="18" font-family="sans-serif">datum</text>
<text x="730" y="250" font-size="18" font-family="sans-serif">raum_id</text>

<line x1="290" y1="170" x2="375" y2="170" stroke="black" stroke-width="2"/>
<text x="305" y="155" font-size="18" font-family="sans-serif">1</text>
<text x="350" y="155" font-size="18" font-family="sans-serif">n</text>
<line x1="625" y1="205" x2="710" y2="205" stroke="black" stroke-width="2"/>
<text x="640" y="190" font-size="18" font-family="sans-serif">n</text>
<text x="690" y="190" font-size="18" font-family="sans-serif">1</text>

<text x="40" y="365" font-size="20" font-family="sans-serif">Ein Besucher kann mehrere Tickets besitzen; jedes Ticket gehört zu genau einer Veranstaltung.</text>
</svg>