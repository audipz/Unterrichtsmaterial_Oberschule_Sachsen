<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Gantt-Diagramm mit Abhängigkeiten und Verzögerung</title><desc id="desc">Projektplan einer Webanwendung. Backend verzögert sich um zwei Tage und verschiebt dadurch Integration, Systemtest und Release auf dem kritischen Pfad.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3z" fill="#6b7280"/></marker><style>.t{font-family:Arial,sans-serif;fill:#17324d}.h{font-size:27px;font-weight:bold}.s{font-size:16px}.b{font-weight:bold}.grid{stroke:#d1d5db;stroke-width:1}.bar{fill:#8fb9dc;stroke:#315b7d;stroke-width:2}.crit{fill:#f3b6b6;stroke:#a94a4a;stroke-width:2}.delay{fill:#f7d98b;stroke:#b68118;stroke-width:2}.dep{stroke:#6b7280;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs><rect width="1200" height="720" fill="#f8fbfe"/><text x="600" y="38" text-anchor="middle" class="t h">Gantt-Diagramm: Abhängigkeiten machen Verschiebungen sichtbar</text><text x="270" y="82" class="t s b">Aufgabe</text><g class="t s" text-anchor="middle"><text x="510" y="82">1</text><text x="560" y="82">2</text><text x="610" y="82">3</text><text x="660" y="82">4</text><text x="710" y="82">5</text><text x="760" y="82">6</text><text x="810" y="82">7</text><text x="860" y="82">8</text><text x="910" y="82">9</text><text x="960" y="82">10</text><text x="1010" y="82">11</text><text x="1060" y="82">12</text><text x="1110" y="82">13</text></g><text x="810" y="61" text-anchor="middle" class="t s">Projekttage</text><g class="grid"><path d="M485 90V570M535 90V570M585 90V570M635 90V570M685 90V570M735 90V570M785 90V570M835 90V570M885 90V570M935 90V570M985 90V570M1035 90V570M1085 90V570M1135 90V570"/><path d="M80 105H1135M80 165H1135M80 225H1135M80 285H1135M80 345H1135M80 405H1135M80 465H1135M80 525H1135M80 570H1135"/></g><g class="t s"><text x="95" y="142">Anforderungen klären</text><text x="95" y="202">Datenmodell</text><text x="95" y="262">Oberfläche entwerfen</text><text x="95" y="322">Backend implementieren</text><text x="95" y="382">Frontend implementieren</text><text x="95" y="442">Integration</text><text x="95" y="502">Systemtest</text><text x="95" y="557">Release</text></g><rect x="485" y="118" width="100" height="30" rx="5" class="crit"/><rect x="585" y="178" width="100" height="30" rx="5" class="crit"/><rect x="585" y="238" width="100" height="30" rx="5" class="bar"/><rect x="685" y="298" width="200" height="30" rx="5" class="crit"/><rect x="685" y="358" width="200" height="30" rx="5" class="bar"/><rect x="885" y="418" width="100" height="30" rx="5" class="crit"/><rect x="985" y="478" width="100" height="30" rx="5" class="crit"/><polygon points="1110,530 1123,545 1110,560 1097,545" class="crit"/><path d="M585 133V170H595" class="dep"/><path d="M585 133V230H595" class="dep"/><path d="M685 193V290H695" class="dep"/><path d="M685 253V350H695" class="dep"/><path d="M885 313V410H895" class="dep"/><path d="M885 373V400H905V410" class="dep"/><path d="M985 433V470H995" class="dep"/><path d="M1085 493V545H1095" class="dep"/><rect x="785" y="298" width="100" height="30" rx="5" class="delay" opacity=".95"/><text x="835" y="319" text-anchor="middle" class="t s b">+2 Tage</text><text x="600" y="615" text-anchor="middle" class="t s b">Rot: kritischer Pfad · Blau: parallele Aufgabe · Gelb: Verzögerung</text><text x="600" y="646" text-anchor="middle" class="t s">Verzögert sich eine kritische Aufgabe ohne Puffer, verschieben sich abhängige Nachfolger und möglicherweise der Endtermin.</text><text x="600" y="681" text-anchor="middle" class="t s">Ein Gantt-Diagramm wird deshalb während des Projekts aktualisiert – es ist kein einmalig gezeichneter Kalender.</text></svg>