<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Schutzziele der Informationssicherheit</title><desc id="desc">Fünf Schutzziele Vertraulichkeit, Integrität, Verfügbarkeit, Authentizität und Verbindlichkeit sind um Daten und Systeme angeordnet.</desc><defs><style>.t{font-family:Arial,sans-serif;fill:#17324d}.h{font-size:28px;font-weight:bold}.s{font-size:18px}.b{font-weight:bold}.c{fill:#e8f1fb;stroke:#315b7d;stroke-width:2.5}.a{fill:#dcfce7;stroke:#31834a;stroke-width:2.5}.w{fill:#fff3cd;stroke:#b68118;stroke-width:2.5}.p{fill:#f3e8ff;stroke:#7e57a3;stroke-width:2.5}.r{fill:#fee2e2;stroke:#a94a4a;stroke-width:2.5}.ln{stroke:#64748b;stroke-width:2.5}</style></defs><rect width="1100" height="650" fill="#f8fbfe"/><text x="550" y="45" text-anchor="middle" class="t h">Schutzziele der Informationssicherheit</text><circle cx="550" cy="330" r="115" fill="#fff" stroke="#315b7d" stroke-width="3"/><text x="550" y="315" text-anchor="middle" class="t h">Daten &amp;</text><text x="550" y="350" text-anchor="middle" class="t h">Systeme</text><line x1="475" y1="245" x2="325" y2="155" class="ln"/><line x1="625" y1="245" x2="775" y2="155" class="ln"/><line x1="665" y1="330" x2="845" y2="330" class="ln"/><line x1="620" y1="420" x2="755" y2="520" class="ln"/><line x1="480" y1="420" x2="345" y2="520" class="ln"/><g transform="translate(90 85)"><rect width="290" height="125" rx="14" class="c"/><text x="145" y="34" text-anchor="middle" class="t s b">Vertraulichkeit</text><text x="145" y="66" text-anchor="middle" class="t s">Nur Berechtigte können</text><text x="145" y="91" text-anchor="middle" class="t s">Informationen lesen.</text></g><g transform="translate(720 85)"><rect width="290" height="125" rx="14" class="a"/><text x="145" y="34" text-anchor="middle" class="t s b">Integrität</text><text x="145" y="66" text-anchor="middle" class="t s">Änderungen bleiben</text><text x="145" y="91" text-anchor="middle" class="t s">erkennbar und kontrolliert.</text></g><g transform="translate(810 268)"><rect width="255" height="125" rx="14" class="w"/><text x="128" y="34" text-anchor="middle" class="t s b">Verfügbarkeit</text><text x="128" y="66" text-anchor="middle" class="t s">Dienste und Daten sind</text><text x="128" y="91" text-anchor="middle" class="t s">bei Bedarf nutzbar.</text></g><g transform="translate(690 485)"><rect width="310" height="125" rx="14" class="p"/><text x="155" y="34" text-anchor="middle" class="t s b">Authentizität</text><text x="155" y="66" text-anchor="middle" class="t s">Identität und Herkunft</text><text x="155" y="91" text-anchor="middle" class="t s">sind überprüfbar.</text></g><g transform="translate(100 485)"><rect width="310" height="125" rx="14" class="r"/><text x="155" y="34" text-anchor="middle" class="t s b">Verbindlichkeit</text><text x="155" y="66" text-anchor="middle" class="t s">Handlungen können später</text><text x="155" y="91" text-anchor="middle" class="t s">nachvollzogen werden.</text></g></svg>