<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="420" viewBox="0 0 1150 420" role="img" aria-labelledby="title desc"><title id="title">Vereinfachte 3D-Rendering-Pipeline</title><desc id="desc">Vom 3D-Modell über Material, Licht und Kamera zur Projektion, Rasterisierung und zum fertigen Bild.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#315b7d"/></marker><style>.t{font-family:Arial,sans-serif;fill:#17324d}.h{font-size:27px;font-weight:bold}.s{font-size:17px}.b{font-weight:bold}.box{fill:#e8f1fb;stroke:#315b7d;stroke-width:2}.alt{fill:#dcfce7;stroke:#31834a;stroke-width:2}.out{fill:#fff3cd;stroke:#b68118;stroke-width:2}.ln{stroke:#315b7d;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1150" height="420" fill="#f8fbfe"/><text x="575" y="42" text-anchor="middle" class="t h">Vom 3D-Modell zum Pixelbild</text><g transform="translate(35 120)"><rect width="155" height="100" rx="10" class="box"/><text x="78" y="38" text-anchor="middle" class="t s b">3D-Modell</text><text x="78" y="67" text-anchor="middle" class="t s">Geometrie</text></g><path d="M190 170H220" class="ln"/><g transform="translate(225 120)"><rect width="155" height="100" rx="10" class="alt"/><text x="78" y="34" text-anchor="middle" class="t s b">Material &amp;</text><text x="78" y="59" text-anchor="middle" class="t s b">Texturen</text><text x="78" y="83" text-anchor="middle" class="t s">Oberfläche</text></g><path d="M380 170H410" class="ln"/><g transform="translate(415 120)"><rect width="140" height="100" rx="10" class="alt"/><text x="70" y="38" text-anchor="middle" class="t s b">Licht</text><text x="70" y="67" text-anchor="middle" class="t s">Beleuchtung</text></g><path d="M555 170H585" class="ln"/><g transform="translate(590 120)"><rect width="140" height="100" rx="10" class="box"/><text x="70" y="38" text-anchor="middle" class="t s b">Kamera</text><text x="70" y="67" text-anchor="middle" class="t s">Blickwinkel</text></g><path d="M730 170H760" class="ln"/><g transform="translate(765 120)"><rect width="165" height="100" rx="10" class="box"/><text x="83" y="34" text-anchor="middle" class="t s b">Projektion &amp;</text><text x="83" y="59" text-anchor="middle" class="t s b">Rasterisierung</text><text x="83" y="83" text-anchor="middle" class="t s">→ Pixel</text></g><path d="M930 170H960" class="ln"/><g transform="translate(965 120)"><rect width="150" height="100" rx="10" class="out"/><text x="75" y="38" text-anchor="middle" class="t s b">Bild/Frame</text><text x="75" y="67" text-anchor="middle" class="t s">Display/Video</text></g><text x="575" y="285" text-anchor="middle" class="t s">Die reale Grafikpipeline besitzt weitere Verarbeitungsschritte. Das Modell zeigt die grundlegende Idee.</text><text x="575" y="325" text-anchor="middle" class="t s b">Rendering berechnet aus einer Szenenbeschreibung ein sichtbares Bild.</text><text x="575" y="360" text-anchor="middle" class="t s">Bei Animationen wird dieser Vorgang für viele aufeinanderfolgende Frames wiederholt.</text></svg>