<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc"><title id="title">Einfaches Netzwerkmodell</title><desc id="desc">Mehrere Endgeräte sind über Switch und Access Point mit einem Router verbunden. Der Router verbindet das lokale Netzwerk mit dem Internet und einem entfernten Server.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#222"/></marker><style>.t{font:24px sans-serif;fill:#111}.s{font:18px sans-serif;fill:#222}.b{fill:#f7f7f7;stroke:#222;stroke-width:2}.l{stroke:#333;stroke-width:3;fill:none}</style></defs><text x="500" y="32" text-anchor="middle" class="t">Vom lokalen Netzwerk zum Internet</text><rect class="b" x="70" y="90" width="160" height="60" rx="9"/><text class="s" x="150" y="126" text-anchor="middle">PC</text><rect class="b" x="70" y="210" width="160" height="60" rx="9"/><text class="s" x="150" y="246" text-anchor="middle">Tablet</text><rect class="b" x="315" y="90" width="170" height="60" rx="9"/><text class="s" x="400" y="126" text-anchor="middle">Switch</text><rect class="b" x="315" y="210" width="170" height="60" rx="9"/><text class="s" x="400" y="246" text-anchor="middle">Access Point</text><rect class="b" x="565" y="150" width="160" height="70" rx="9"/><text class="s" x="645" y="192" text-anchor="middle">Router</text><ellipse class="b" cx="835" cy="185" rx="100" ry="58"/><text class="s" x="835" y="192" text-anchor="middle">Internet</text><rect class="b" x="760" y="300" width="150" height="60" rx="9"/><text class="s" x="835" y="336" text-anchor="middle">Server</text><path class="l" d="M230 120H315M230 240H315M485 120H525V175H565M485 240H525V195H565M725 185H735M835 243V300"/><text class="s" x="500" y="395" text-anchor="middle">Switch und Access Point verbinden Geräte lokal; der Router verbindet verschiedene Netzwerke.</text></svg>