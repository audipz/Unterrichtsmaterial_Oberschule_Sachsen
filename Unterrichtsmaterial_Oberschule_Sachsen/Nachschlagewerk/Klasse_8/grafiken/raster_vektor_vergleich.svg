  <text x="260" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#333">Bild besteht aus einzelnen Pixeln.</text>
  <text x="260" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#333">Starke Vergrößerung macht das Raster sichtbar.</text>
  <text x="740" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#333">Formen werden durch geometrische Daten beschrieben.</text>
  <text x="740" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#333">Sie lassen sich ohne Pixelraster skalieren.</text>
  <text x="500" y="497" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#555">Beide Darstellungen sind sinnvoll – entscheidend sind Bildinhalt und Verwendungszweck.</text>
</svg>