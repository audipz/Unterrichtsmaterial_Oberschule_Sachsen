  <rect x="40" y="75" width="440" height="390" rx="18" fill="#eef5fb" stroke="#4f81bd" stroke-width="3"/>
  <rect x="520" y="75" width="440" height="390" rx="18" fill="#f4f8ef" stroke="#70ad47" stroke-width="3"/>
  <text x="260" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#17365d">Rastergrafik</text>
  <text x="740" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#385723">Vektorgrafik</text>
  <g stroke="#9fbad0" stroke-width="1">
