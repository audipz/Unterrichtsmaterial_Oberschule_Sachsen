<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Struktogramm zur Frostwarnung</title>
  <desc id="desc">Nassi-Shneiderman-Diagramm mit Eingabe der Temperatur und einer Auswahl: unter null Grad Frostwarnung, sonst kein Frost.</desc>
  <rect width="1000" height="560" fill="#f8fbff"/>
  <text x="500" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#17365d">Struktogramm: Frostwarnung</text>

  <g stroke="#2f5597" stroke-width="3" fill="none">
    <rect x="150" y="95" width="700" height="390" rx="4" fill="#ffffff"/>
    <rect x="150" y="95" width="700" height="95" fill="#d9eaf7"/>
    <line x1="150" y1="190" x2="850" y2="190"/>
    <line x1="150" y1="310" x2="850" y2="310"/>
    <line x1="500" y1="310" x2="500" y2="485"/>
    <line x1="150" y1="190" x2="500" y2="310"/>
    <line x1="850" y1="190" x2="500" y2="310"/>
  </g>

  <text x="500" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#17365d">Temperatur eingeben</text>
  <text x="500" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17365d">Temperatur &lt; 0 °C?</text>
  <text x="270" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#2e7d32">JA</text>
  <text x="730" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#b06a00">NEIN</text>

  <rect x="152" y="312" width="346" height="171" fill="#e7f4e8"/>
  <rect x="502" y="312" width="346" height="171" fill="#fff1d6"/>
  <text x="325" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#1f5f25">„Frostwarnung“ ausgeben</text>
  <text x="675" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#8a5200">„kein Frost“ ausgeben</text>

  <text x="500" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#4a5568">Kontrollstrukturen werden als verschachtelte Blöcke dargestellt; Ablaufpfeile sind nicht nötig.</text>
</svg>
