<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" role="img" aria-labelledby="title desc"><title id="title">Steuerung und Regelung im Vergleich</title><desc id="desc">Oben eine Steuerung ohne Rückführung, unten ein Regelkreis mit Sollwert, Regler, Aktor, Prozess, Sensor und Rückführung des Istwertes.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#315b7d"/></marker><style>.t{font-family:Arial,sans-serif;fill:#17324d}.h{font-size:26px;font-weight:bold}.s{font-size:18px}.b{font-weight:bold}.box{fill:#e8f1fb;stroke:#315b7d;stroke-width:2}.proc{fill:#dcfce7;stroke:#31834a;stroke-width:2}.cmp{fill:#fff3cd;stroke:#b68118;stroke-width:2}.ln{stroke:#315b7d;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1100" height="570" fill="#f8fbfe"/><text x="550" y="40" text-anchor="middle" class="t h">Steuerung und Regelung im Vergleich</text>
<text x="50" y="92" class="t h">Steuerung – ohne Rückführung des Ergebnisses</text><rect x="70" y="125" width="190" height="70" rx="8" class="box"/><text x="165" y="154" text-anchor="middle" class="t s b">Eingabe / Regel</text><text x="165" y="179" text-anchor="middle" class="t s">z. B. 21:00 Uhr</text><rect x="350" y="125" width="190" height="70" rx="8" class="box"/><text x="445" y="154" text-anchor="middle" class="t s b">Steuerung</text><text x="445" y="179" text-anchor="middle" class="t s">Befehl erzeugen</text><rect x="630" y="125" width="190" height="70" rx="8" class="proc"/><text x="725" y="154" text-anchor="middle" class="t s b">Aktor</text><text x="725" y="179" text-anchor="middle" class="t s">Rollladenmotor</text><rect x="885" y="125" width="160" height="70" rx="8" class="proc"/><text x="965" y="154" text-anchor="middle" class="t s b">Wirkung</text><text x="965" y="179" text-anchor="middle" class="t s">fährt herunter</text><path class="ln" d="M260 160 H342"/><path class="ln" d="M540 160 H622"/><path class="ln" d="M820 160 H877"/>
<text x="50" y="280" class="t h">Regelung – Istwert wird zurückgeführt</text><rect x="55" y="325" width="150" height="70" rx="8" class="box"/><text x="130" y="354" text-anchor="middle" class="t s b">Sollwert</text><text x="130" y="379" text-anchor="middle" class="t s">21 °C</text><circle cx="285" cy="360" r="38" class="cmp"/><text x="285" y="355" text-anchor="middle" class="t s b">Soll /</text><text x="285" y="377" text-anchor="middle" class="t s b">Ist</text><rect x="375" y="325" width="155" height="70" rx="8" class="box"/><text x="452" y="354" text-anchor="middle" class="t s b">Regler</text><text x="452" y="379" text-anchor="middle" class="t s">entscheidet</text><rect x="605" y="325" width="155" height="70" rx="8" class="proc"/><text x="682" y="354" text-anchor="middle" class="t s b">Aktor</text><text x="682" y="379" text-anchor="middle" class="t s">Heizventil</text><rect x="835" y="325" width="190" height="70" rx="8" class="proc"/><text x="930" y="354" text-anchor="middle" class="t s b">Prozess / Raum</text><text x="930" y="379" text-anchor="middle" class="t s">Temperatur ändert sich</text><path class="ln" d="M205 360 H239"/><path class="ln" d="M323 360 H367"/><path class="ln" d="M530 360 H597"/><path class="ln" d="M760 360 H827"/><rect x="650" y="465" width="175" height="62" rx="8" class="box"/><text x="737" y="491" text-anchor="middle" class="t s b">Sensor</text><text x="737" y="514" text-anchor="middle" class="t s">misst Istwert</text><path class="ln" d="M930 395 V496 H833"/><path class="ln" d="M650 496 H285 V406"/><text x="440" y="486" class="t s">Rückführung: gemessener Istwert</text></svg>