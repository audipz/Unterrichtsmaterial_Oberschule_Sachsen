<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc"><title id="title">Workflow zur Prüfung eines digitalen Bildes</title><desc id="desc">Sechs Schritte führen von Behauptung und Quelle über Kontext, Rückwärtssuche, Metadaten und Bildinhalt zur Gesamtbewertung.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#315b7d"/></marker><style>.t{font-family:Arial,sans-serif;fill:#17324d}.h{font-size:27px;font-weight:bold}.s{font-size:17px}.b{font-weight:bold}.box{fill:#e8f1fb;stroke:#315b7d;stroke-width:2}.warn{fill:#fff3cd;stroke:#b68118;stroke-width:2}.ok{fill:#dcfce7;stroke:#31834a;stroke-width:2}.ln{stroke:#315b7d;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1100" height="520" fill="#f8fbfe"/><text x="550" y="42" text-anchor="middle" class="t h">Ein Bild systematisch prüfen</text><g transform="translate(35 100)"><rect width="160" height="105" rx="10" class="box"/><text x="80" y="31" text-anchor="middle" class="t s b">1 Behauptung</text><text x="80" y="59" text-anchor="middle" class="t s">Was soll das</text><text x="80" y="82" text-anchor="middle" class="t s">Bild belegen?</text></g><path class="ln" d="M195 152 H220"/><g transform="translate(225 100)"><rect width="160" height="105" rx="10" class="box"/><text x="80" y="31" text-anchor="middle" class="t s b">2 Quelle</text><text x="80" y="59" text-anchor="middle" class="t s">Wer veröffentlichte</text><text x="80" y="82" text-anchor="middle" class="t s">es zuerst?</text></g><path class="ln" d="M385 152 H410"/><g transform="translate(415 100)"><rect width="160" height="105" rx="10" class="box"/><text x="80" y="31" text-anchor="middle" class="t s b">3 Kontext</text><text x="80" y="59" text-anchor="middle" class="t s">Ort, Zeit und</text><text x="80" y="82" text-anchor="middle" class="t s">Bildunterschrift?</text></g><path class="ln" d="M575 152 H600"/><g transform="translate(605 100)"><rect width="190" height="105" rx="10" class="warn"/><text x="95" y="31" text-anchor="middle" class="t s b">4 Rückwärtssuche</text><text x="95" y="59" text-anchor="middle" class="t s">Ältere Versionen</text><text x="95" y="82" text-anchor="middle" class="t s">oder andere Nutzung?</text></g><path class="ln" d="M795 152 H820"/><g transform="translate(825 100)"><rect width="240" height="105" rx="10" class="warn"/><text x="120" y="31" text-anchor="middle" class="t s b">5 Datei &amp; Bildinhalt</text><text x="120" y="59" text-anchor="middle" class="t s">Metadaten, Schatten,</text><text x="120" y="82" text-anchor="middle" class="t s">Perspektive, Übergänge</text></g><path class="ln" d="M945 205 V260 H550 V285"/><g transform="translate(365 290)"><rect width="370" height="120" rx="12" class="ok"/><text x="185" y="34" text-anchor="middle" class="t s b">6 Gesamtbewertung</text><text x="185" y="64" text-anchor="middle" class="t s">Mehrere Hinweise zusammenführen.</text><text x="185" y="89" text-anchor="middle" class="t s">Unsicherheit benennen statt raten.</text></g><text x="550" y="465" text-anchor="middle" class="t s b">Kein einzelnes Merkmal beweist allein Echtheit oder Manipulation.</text></svg>