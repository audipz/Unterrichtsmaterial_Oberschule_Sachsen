<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
<title id="title">Iteratives und inkrementelles Arbeiten</title><desc id="desc">Links wird ein vorhandener Stand wiederholt verbessert. Rechts wächst eine Software schrittweise um neue funktionsfähige Teile.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2f5597"/></marker><style>.h{font:700 25px Arial;fill:#17365d}.t{font:19px Arial;fill:#26384a}.s{font:16px Arial;fill:#4a5568}.box{stroke:#2f5597;stroke-width:2;rx:9}.arr{stroke:#2f5597;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1100" height="620" fill="#f8fbff"/><text x="550" y="42" text-anchor="middle" class="h">Iterativ und inkrementell – zwei verschiedene, oft kombinierte Ideen</text>
<line x1="550" y1="75" x2="550" y2="570" stroke="#c7d3df" stroke-width="2"/>
<text x="275" y="90" text-anchor="middle" class="h">Iterativ: verbessern</text><text x="825" y="90" text-anchor="middle" class="h">Inkrementell: erweitern</text>
<g transform="translate(120 145)"><rect width="170" height="70" class="box" fill="#d9eaf7"/><text x="85" y="43" text-anchor="middle" class="t">Entwurf</text></g>
<g transform="translate(330 145)"><rect width="170" height="70" class="box" fill="#e7f4e8"/><text x="85" y="43" text-anchor="middle" class="t">Umsetzen</text></g>
<g transform="translate(330 285)"><rect width="170" height="70" class="box" fill="#fff1d6"/><text x="85" y="43" text-anchor="middle" class="t">Testen</text></g>
<g transform="translate(120 285)"><rect width="170" height="70" class="box" fill="#fce8e6"/><text x="85" y="43" text-anchor="middle" class="t">Verbessern</text></g>
<path d="M290 180 H322" class="arr"/><path d="M415 215 V277" class="arr"/><path d="M330 320 H298" class="arr"/><path d="M205 285 V223" class="arr"/>
<text x="275" y="415" text-anchor="middle" class="t">Ein vorhandener Stand wird mehrfach geprüft</text><text x="275" y="442" text-anchor="middle" class="t">und gezielt verbessert.</text>
<g transform="translate(615 150)"><rect width="360" height="70" class="box" fill="#d9eaf7"/><text x="180" y="42" text-anchor="middle" class="t">1. Kernfunktion funktioniert</text></g>
<g transform="translate(650 245)"><rect width="325" height="70" class="box" fill="#e7f4e8"/><text x="162" y="42" text-anchor="middle" class="t">+ Eingabeprüfung</text></g>
<g transform="translate(685 340)"><rect width="290" height="70" class="box" fill="#fff1d6"/><text x="145" y="42" text-anchor="middle" class="t">+ Speichern</text></g>
<g transform="translate(720 435)"><rect width="255" height="70" class="box" fill="#efe8ff"/><text x="128" y="42" text-anchor="middle" class="t">+ Auswertung</text></g>
<path d="M795 220 V237" class="arr"/><path d="M812 315 V332" class="arr"/><path d="M830 410 V427" class="arr"/>
<text x="825" y="545" text-anchor="middle" class="t">Jedes Inkrement fügt einen nutzbaren Teil hinzu.</text>
<text x="550" y="595" text-anchor="middle" class="s">In Projekten wird häufig beides kombiniert: Ein Inkrement wird gebaut und innerhalb mehrerer Iterationen verbessert.</text>
</svg>