<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc">
<title id="title">Automatisierung im Smart Home</title><desc id="desc">Haus mit Sensoren für Temperatur, Regen, Helligkeit, Wind, Bewegung und Bodenfeuchte sowie Aktoren für Heizung, Fenster, Rollladen, Markise, Licht und Bewässerung. Eine zentrale Verarbeitung wertet Regeln aus.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#315b7d"/></marker><style>.t{font-family:Arial,sans-serif;fill:#17324d}.h{font-size:27px;font-weight:bold}.s{font-size:18px}.b{font-weight:bold}.sensor{fill:#dbeafe;stroke:#2563a6;stroke-width:2}.aktor{fill:#dcfce7;stroke:#31834a;stroke-width:2}.ctrl{fill:#fff3cd;stroke:#b68118;stroke-width:2}.house{fill:#fff;stroke:#64748b;stroke-width:3}.ln{stroke:#315b7d;stroke-width:2.5;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1100" height="700" fill="#f8fbfe"/><text x="550" y="42" text-anchor="middle" class="t h">Automatisierung im Smart Home</text>
<path class="house" d="M330 215 L550 80 L770 215 V610 H330 Z"/><rect x="485" y="420" width="130" height="190" fill="#eef2f6" stroke="#64748b" stroke-width="2"/><rect x="385" y="280" width="105" height="100" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/><rect x="610" y="280" width="105" height="100" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/>
<rect x="420" y="185" width="260" height="72" rx="10" class="ctrl"/><text x="550" y="213" text-anchor="middle" class="t s b">Verarbeitung / Steuerung</text><text x="550" y="238" text-anchor="middle" class="t s">Messwerte + Regeln + Sollwerte</text>
<g><rect x="25" y="100" width="230" height="62" rx="9" class="sensor"/><text x="140" y="126" text-anchor="middle" class="t s b">Temperatursensor</text><text x="140" y="149" text-anchor="middle" class="t s">misst Raumtemperatur</text><path class="ln" d="M255 131 C320 131 350 195 420 215"/>
<rect x="25" y="185" width="230" height="62" rx="9" class="sensor"/><text x="140" y="211" text-anchor="middle" class="t s b">Regensensor</text><text x="140" y="234" text-anchor="middle" class="t s">erkennt Niederschlag</text><path class="ln" d="M255 216 H410"/>
<rect x="25" y="270" width="230" height="62" rx="9" class="sensor"/><text x="140" y="296" text-anchor="middle" class="t s b">Helligkeitssensor</text><text x="140" y="319" text-anchor="middle" class="t s">misst Licht</text><path class="ln" d="M255 301 C330 301 350 245 420 230"/>
<rect x="25" y="355" width="230" height="62" rx="9" class="sensor"/><text x="140" y="381" text-anchor="middle" class="t s b">Wind-/Bewegungssensor</text><text x="140" y="404" text-anchor="middle" class="t s">erfasst Umgebung</text><path class="ln" d="M255 386 C350 386 365 265 430 240"/>
<rect x="25" y="440" width="230" height="62" rx="9" class="sensor"/><text x="140" y="466" text-anchor="middle" class="t s b">Bodenfeuchtesensor</text><text x="140" y="489" text-anchor="middle" class="t s">misst Feuchtigkeit</text><path class="ln" d="M255 471 C365 471 380 270 440 245"/></g>
<g><rect x="845" y="100" width="230" height="62" rx="9" class="aktor"/><text x="960" y="126" text-anchor="middle" class="t s b">Heizventil</text><text x="960" y="149" text-anchor="middle" class="t s">wärmt den Raum</text><path class="ln" d="M680 210 C755 190 780 131 845 131"/>
<rect x="845" y="185" width="230" height="62" rx="9" class="aktor"/><text x="960" y="211" text-anchor="middle" class="t s b">Fenstermotor</text><text x="960" y="234" text-anchor="middle" class="t s">schließt bei Regen</text><path class="ln" d="M690 216 H845"/>
<rect x="845" y="270" width="230" height="62" rx="9" class="aktor"/><text x="960" y="296" text-anchor="middle" class="t s b">Rollladen / Markise</text><text x="960" y="319" text-anchor="middle" class="t s">fährt ein oder aus</text><path class="ln" d="M680 230 C755 245 780 301 845 301"/>
<rect x="845" y="355" width="230" height="62" rx="9" class="aktor"/><text x="960" y="381" text-anchor="middle" class="t s b">Beleuchtung</text><text x="960" y="404" text-anchor="middle" class="t s">schaltet Licht</text><path class="ln" d="M670 240 C760 270 780 386 845 386"/>
<rect x="845" y="440" width="230" height="62" rx="9" class="aktor"/><text x="960" y="466" text-anchor="middle" class="t s b">Wasserventil</text><text x="960" y="489" text-anchor="middle" class="t s">bewässert den Garten</text><path class="ln" d="M660 245 C760 310 785 471 845 471"/></g>
<rect x="365" y="635" width="370" height="42" rx="8" fill="#eef2ff" stroke="#64748b"/><text x="550" y="662" text-anchor="middle" class="t s b">Sensor → Verarbeitung/Regeln → Aktor → Wirkung</text>
</svg>