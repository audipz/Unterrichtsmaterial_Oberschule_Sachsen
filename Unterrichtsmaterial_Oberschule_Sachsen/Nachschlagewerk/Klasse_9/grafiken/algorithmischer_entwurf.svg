<title id="title">Vom Problem zum algorithmischen Entwurf</title><desc id="desc">Ein Ablauf von Anforderungen über Zerlegung und Teilalgorithmen bis zu Pseudocode, Struktogramm oder Ablaufdiagramm, Implementierung und Tests.</desc>
