<g transform="translate(545 85)"><rect width="190" height="100" class="b" fill="#fff1d6"/><text x="95" y="38" text-anchor="middle" class="h">Teilalgorithmen</text><text x="95" y="68" text-anchor="middle" class="s">Ein-/Ausgabe, Fälle, Schleifen</text></g>
<g transform="translate(790 85)"><rect width="250" height="100" class="b" fill="#efe8ff"/><text x="125" y="35" text-anchor="middle" class="h">Darstellung</text><text x="125" y="64" text-anchor="middle" class="s">Pseudocode · Struktogramm</text><text x="125" y="85" text-anchor="middle" class="s">Ablaufdiagramm</text></g>
