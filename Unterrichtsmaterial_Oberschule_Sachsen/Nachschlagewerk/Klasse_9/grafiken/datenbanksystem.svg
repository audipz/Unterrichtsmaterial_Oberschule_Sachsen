<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Aufbau eines Datenbanksystems</title>
  <desc id="desc">Benutzer und Anwendungen greifen über ein Datenbankmanagementsystem auf die Datenbasis zu.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#2f5597"/>
    </marker>
  </defs>
  <rect width="1100" height="520" fill="#f8fbff"/>
  <text x="550" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#17365d">Datenbanksystem</text>
  <rect x="80" y="140" width="260" height="150" rx="18" fill="#e8f1fb" stroke="#2f5597" stroke-width="3"/>
  <text x="210" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17365d">Benutzer /</text>
  <text x="210" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17365d">Anwendungen</text>
  <text x="210" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#4a5568">stellen Abfragen und ändern Daten</text>

  <rect x="420" y="115" width="300" height="200" rx="18" fill="#d9eaf7" stroke="#2f5597" stroke-width="3"/>
  <text x="570" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17365d">DBMS</text>
  <text x="570" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#17365d">Datenbankmanagementsystem</text>
  <text x="570" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#4a5568">prüft, sucht, speichert, ändert</text>
  <text x="570" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#4a5568">und organisiert Zugriffe</text>

  <g transform="translate(800 125)">
    <ellipse cx="120" cy="30" rx="110" ry="30" fill="#e7f4e8" stroke="#2f5597" stroke-width="3"/>
    <rect x="10" y="30" width="220" height="170" fill="#e7f4e8" stroke="#2f5597" stroke-width="3"/>
    <ellipse cx="120" cy="200" rx="110" ry="30" fill="#d6edd9" stroke="#2f5597" stroke-width="3"/>
    <ellipse cx="120" cy="30" rx="110" ry="30" fill="#eef8ef" stroke="#2f5597" stroke-width="3"/>
    <text x="120" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#1f5f25">Datenbasis</text>
    <text x="120" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#3d5c43">Tabellen, Datensätze,</text>
    <text x="120" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#3d5c43">Beziehungen und Werte</text>
  </g>

  <g stroke="#2f5597" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <line x1="340" y1="215" x2="405" y2="215"/>
    <line x1="720" y1="215" x2="790" y2="215"/>
  </g>
  <text x="550" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#4a5568">Das DBMS vermittelt zwischen Anwendungen und den strukturiert gespeicherten Daten.</text>
</svg>