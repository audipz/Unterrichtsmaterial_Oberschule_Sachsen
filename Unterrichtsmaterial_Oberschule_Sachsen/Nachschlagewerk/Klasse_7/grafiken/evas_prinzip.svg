<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="title desc"><title id="title">EVAS-Prinzip</title><desc id="desc">Eingabe führt zur Verarbeitung, Ausgabe und Speicherung; Speicherung steht mit Verarbeitung in Verbindung.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#222"/></marker><style>.b{fill:#f5f5f5;stroke:#222;stroke-width:2}.t{font:24px sans-serif;fill:#111}.s{font:18px sans-serif;fill:#333}.l{stroke:#222;stroke-width:3;marker-end:url(#a)}</style></defs><text x="500" y="32" text-anchor="middle" class="t">EVA(S)-Prinzip</text><rect class="b" x="40" y="80" width="190" height="80" rx="10"/><rect class="b" x="300" y="80" width="190" height="80" rx="10"/><rect class="b" x="560" y="80" width="190" height="80" rx="10"/><rect class="b" x="810" y="80" width="150" height="80" rx="10"/><text class="t" x="135" y="128" text-anchor="middle">Eingabe</text><text class="t" x="395" y="128" text-anchor="middle">Verarbeitung</text><text class="t" x="655" y="128" text-anchor="middle">Ausgabe</text><text class="t" x="885" y="128" text-anchor="middle">Speicher</text><line class="l" x1="230" y1="120" x2="295" y2="120"/><line class="l" x1="490" y1="120" x2="555" y2="120"/><line class="l" x1="750" y1="120" x2="805" y2="120"/><path class="l" fill="none" d="M885 165 V215 H395 V165"/><text class="s" x="500" y="248" text-anchor="middle">Daten können gespeichert und später wieder verarbeitet werden.</text></svg>