<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title desc"><title id="title">Audiodigitalisierung</title><desc id="desc">Eine analoge Wellenform wird in regelmäßigen Zeitabständen abgetastet. Die Messpunkte werden auf diskrete Zahlenwerte gerundet.</desc><defs><style>.t{font:24px sans-serif;fill:#111}.s{font:18px sans-serif;fill:#333}.a{fill:none;stroke:#222;stroke-width:3}.grid{stroke:#bbb;stroke-width:1}.sample{fill:#222}.stem{stroke:#666;stroke-width:2}</style></defs><text x="480" y="32" text-anchor="middle" class="t">Vom analogen Signal zu digitalen Messwerten</text><g transform="translate(60 70)"><line x1="0" y1="110" x2="840" y2="110" class="grid"/><line x1="0" y1="40" x2="840" y2="40" class="grid"/><line x1="0" y1="180" x2="840" y2="180" class="grid"/><path class="a" d="M0 110 C70 20 140 20 210 110 S350 200 420 110 S560 20 630 110 S770 200 840 110"/><g><line class="stem" x1="70" y1="110" x2="70" y2="50"/><circle class="sample" cx="70" cy="50" r="6"/><line class="stem" x1="175" y1="110" x2="175" y2="84"/><circle class="sample" cx="175" cy="84" r="6"/><line class="stem" x1="280" y1="110" x2="280" y2="174"/><circle class="sample" cx="280" cy="174" r="6"/><line class="stem" x1="385" y1="110" x2="385" y2="137"/><circle class="sample" cx="385" cy="137" r="6"/><line class="stem" x1="490" y1="110" x2="490" y2="47"/><circle class="sample" cx="490" cy="47" r="6"/><line class="stem" x1="595" y1="110" x2="595" y2="80"/><circle class="sample" cx="595" cy="80" r="6"/><line class="stem" x1="700" y1="110" x2="700" y2="171"/><circle class="sample" cx="700" cy="171" r="6"/><line class="stem" x1="805" y1="110" x2="805" y2="142"/><circle class="sample" cx="805" cy="142" r="6"/></g><text class="s" x="420" y="225" text-anchor="middle">Messpunkte in gleichen Zeitabständen</text><text class="s" x="420" y="255" text-anchor="middle">Die Höhe jedes Punktes wird als Zahlenwert gespeichert.</text></g></svg>