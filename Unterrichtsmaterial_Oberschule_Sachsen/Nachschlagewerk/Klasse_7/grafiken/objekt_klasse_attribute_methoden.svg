<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" role="img" aria-labelledby="title desc"><title id="title">Objekt, Klasse, Attribute und Methoden</title><desc id="desc">Links die Klasse Fahrrad mit Attributen und Methoden, rechts das konkrete Objekt Fahrrad_17 mit Attributwerten.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#222"/></marker><style>.t{font:24px sans-serif;fill:#111}.h{font:bold 22px sans-serif;fill:#111}.s{font:19px sans-serif;fill:#222}.b{fill:#f7f7f7;stroke:#222;stroke-width:2}.l{stroke:#222;stroke-width:3;marker-end:url(#a)}</style></defs><text x="490" y="35" text-anchor="middle" class="t">Klasse beschreibt – Objekt ist konkret</text><rect class="b" x="70" y="75" width="360" height="285" rx="10"/><text class="h" x="250" y="112" text-anchor="middle">Klasse: Fahrrad</text><line x1="70" y1="128" x2="430" y2="128" stroke="#555"/><text class="s" x="95" y="165">Attribute</text><text class="s" x="125" y="197">• Farbe</text><text class="s" x="125" y="227">• Rahmengröße</text><text class="s" x="125" y="257">• verfügbar</text><text class="s" x="95" y="302">Methoden</text><text class="s" x="125" y="334">• ausleihen()</text><text class="s" x="265" y="334">• zurückgeben()</text><rect class="b" x="570" y="105" width="340" height="225" rx="10"/><text class="h" x="740" y="142" text-anchor="middle">Objekt: Fahrrad_17</text><line x1="570" y1="158" x2="910" y2="158" stroke="#555"/><text class="s" x="600" y="198">Farbe = blau</text><text class="s" x="600" y="233">Rahmengröße = 48 cm</text><text class="s" x="600" y="268">verfügbar = ja</text><line class="l" x1="430" y1="218" x2="565" y2="218"/><text class="s" x="498" y="203" text-anchor="middle">Instanz</text><text class="s" x="490" y="395" text-anchor="middle">Die Klasse legt gemeinsame Merkmale fest; jedes Objekt besitzt konkrete Attributwerte.</text></svg>