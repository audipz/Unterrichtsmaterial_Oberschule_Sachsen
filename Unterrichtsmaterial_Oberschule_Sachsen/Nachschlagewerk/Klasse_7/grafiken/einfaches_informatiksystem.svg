<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#4f81bd"/>
    </marker>
  </defs>
  <rect width="1000" height="430" fill="#ffffff"/>
  <text x="500" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#17365d">Vereinfachtes Modell eines Informatiksystems</text>
  <rect x="80" y="135" width="210" height="95" rx="16" fill="#eef5fb" stroke="#4f81bd" stroke-width="3"/>
  <rect x="395" y="120" width="210" height="125" rx="16" fill="#dce6f1" stroke="#4f81bd" stroke-width="3"/>
  <rect x="710" y="135" width="210" height="95" rx="16" fill="#eef5fb" stroke="#4f81bd" stroke-width="3"/>
  <rect x="395" y="300" width="210" height="85" rx="16" fill="#fff2cc" stroke="#bf9000" stroke-width="3"/>
  <text x="185" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#17365d">Eingabe</text>
  <text x="500" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#17365d">Verarbeitung</text>
  <text x="815" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#17365d">Ausgabe</text>
  <text x="500" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#7f6000">Speicherung</text>
  <text x="185" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#444">z. B. Tastatur, Sensor</text>
  <text x="500" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#444">Programme verarbeiten Daten</text>
  <text x="815" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#444">z. B. Bildschirm, Ton</text>
  <text x="500" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#444">z. B. SSD oder Datei</text>
  <line x1="290" y1="182" x2="385" y2="182" stroke="#4f81bd" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="605" y1="182" x2="700" y2="182" stroke="#4f81bd" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="500" y1="245" x2="500" y2="288" stroke="#bf9000" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M430 300 C360 270, 340 245, 395 218" fill="none" stroke="#bf9000" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <text x="300" y="280" font-family="Arial, sans-serif" font-size="15" fill="#7f6000">gespeicherte Daten können später wieder verwendet werden</text>
</svg>