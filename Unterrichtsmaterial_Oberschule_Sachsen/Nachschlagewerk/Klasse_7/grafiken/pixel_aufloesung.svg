<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-labelledby="title desc"><title id="title">Pixel und Auflösung</title><desc id="desc">Links ein grobes Raster mit wenigen großen Pixeln, rechts ein feineres Raster mit mehr kleinen Pixeln auf gleicher Fläche.</desc><defs><style>.t{font:24px sans-serif;fill:#111}.s{font:18px sans-serif;fill:#333}.r{fill:#f7f7f7;stroke:#222;stroke-width:2}.g{stroke:#555;stroke-width:1}</style></defs><text x="450" y="35" text-anchor="middle" class="t">Pixel und Auflösung</text><rect class="r" x="70" y="70" width="300" height="180"/><g class="g"><path d="M130 70V250M190 70V250M250 70V250M310 70V250M70 130H370M70 190H370"/></g><rect x="190" y="130" width="60" height="60" fill="#d9d9d9"/><text class="s" x="220" y="285" text-anchor="middle">5 × 3 = 15 Pixel</text><rect class="r" x="530" y="70" width="300" height="180"/><g class="g"><path d="M560 70V250M590 70V250M620 70V250M650 70V250M680 70V250M710 70V250M740 70V250M770 70V250M800 70V250M530 100H830M530 130H830M530 160H830M530 190H830M530 220H830"/></g><rect x="650" y="130" width="30" height="30" fill="#d9d9d9"/><text class="s" x="680" y="285" text-anchor="middle">10 × 6 = 60 Pixel</text><text class="s" x="450" y="312" text-anchor="middle">Mehr Pixel auf gleicher Fläche ermöglichen feinere Details.</text></svg>