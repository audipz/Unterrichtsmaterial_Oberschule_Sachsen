<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-labelledby="title desc">
<title id="title">Binär-Stellenwerttafel</title><desc id="desc">Acht Stellen mit den Zweierpotenzen 128 bis 1 und dem Beispiel 00101101 gleich 45.</desc>
<defs><style>.t{font:24px sans-serif;fill:#111}.s{font:20px sans-serif;fill:#222}.b{fill:#f5f5f5;stroke:#333;stroke-width:2}.on{fill:#e5e5e5;stroke:#111;stroke-width:3}</style></defs>
<text x="450" y="35" text-anchor="middle" class="t">Binär-Stellenwerttafel</text>
<g transform="translate(50 60)">
<rect class="b" width="100" height="120"/><rect class="b" x="100" width="100" height="120"/><rect class="on" x="200" width="100" height="120"/><rect class="b" x="300" width="100" height="120"/><rect class="on" x="400" width="100" height="120"/><rect class="on" x="500" width="100" height="120"/><rect class="b" x="600" width="100" height="120"/><rect class="on" x="700" width="100" height="120"/>
<g class="s" text-anchor="middle"><text x="50" y="35">128</text><text x="150" y="35">64</text><text x="250" y="35">32</text><text x="350" y="35">16</text><text x="450" y="35">8</text><text x="550" y="35">4</text><text x="650" y="35">2</text><text x="750" y="35">1</text><text x="50" y="90">0</text><text x="150" y="90">0</text><text x="250" y="90">1</text><text x="350" y="90">0</text><text x="450" y="90">1</text><text x="550" y="90">1</text><text x="650" y="90">0</text><text x="750" y="90">1</text></g>
</g><text x="450" y="230" text-anchor="middle" class="t">32 + 8 + 4 + 1 = 45</text><text x="450" y="260" text-anchor="middle" class="s">00101101₂ = 45₁₀</text>
</svg>