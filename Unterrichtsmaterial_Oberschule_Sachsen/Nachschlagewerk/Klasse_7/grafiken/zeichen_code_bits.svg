<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-labelledby="title desc"><title id="title">Vom Zeichen zu Bits</title><desc id="desc">Das Zeichen A wird einem Zahlencode 65 zugeordnet und als Bitfolge 01000001 dargestellt.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#222"/></marker><style>.b{fill:#f5f5f5;stroke:#222;stroke-width:2}.t{font:25px sans-serif;fill:#111}.s{font:18px sans-serif;fill:#333}.l{stroke:#222;stroke-width:3;marker-end:url(#a)}</style></defs><text x="450" y="35" text-anchor="middle" class="t">Zeichen → Code → Bits</text><rect class="b" x="50" y="75" width="200" height="95" rx="10"/><rect class="b" x="350" y="75" width="200" height="95" rx="10"/><rect class="b" x="650" y="75" width="200" height="95" rx="10"/><text class="t" x="150" y="120" text-anchor="middle">A</text><text class="s" x="150" y="150" text-anchor="middle">Zeichen</text><text class="t" x="450" y="120" text-anchor="middle">65</text><text class="s" x="450" y="150" text-anchor="middle">Codewert</text><text class="t" x="750" y="120" text-anchor="middle">01000001</text><text class="s" x="750" y="150" text-anchor="middle">8 Bits</text><line class="l" x1="250" y1="122" x2="345" y2="122"/><line class="l" x1="550" y1="122" x2="645" y2="122"/><text class="s" x="450" y="210" text-anchor="middle">Eine Zeichencodierung legt fest, welcher Codewert zu welchem Zeichen gehört.</text></svg>