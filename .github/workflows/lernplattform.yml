name: Lernplattform CI

on:
  push:
    branches:
      - "**"
    paths:
      - "Lernplattform/**"
      - ".github/workflows/lernplattform.yml"
  pull_request:
    paths:
      - "Lernplattform/**"
      - ".github/workflows/lernplattform.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lernplattform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Java 25 / Maven verify
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Java 25 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: Lernplattform/**/pom.xml

      - name: Java- und Maven-Version anzeigen
        run: |
          java -version
          mvn -version

      - name: Lernplattform bauen und testen
        run: mvn -B -f Lernplattform/pom.xml verify

  frontend:
    name: Angular 22 / production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Lernplattform/frontend/angular-app

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Node.js 24 einrichten
        uses: actions/setup-node@v5
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: Lernplattform/frontend/angular-app/package.json

      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund

      - name: Angular Production Build
        run: npm run build

      - name: Runtime-Module syntaktisch prüfen
        working-directory: ${{ github.workspace }}
        run: find Lernplattform/frontend/ui-artifacts -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check

  helm:
    name: Helm lint / template
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Helm einrichten
        uses: azure/setup-helm@v4
        with:
          version: v4.2.3

      - name: Helm-Version anzeigen
        run: helm version

      - name: Helm-Chart linten
        run: helm lint Lernplattform/deployment/helm/lernplattform

      - name: Standard-Chart mit HPA rendern
        run: |
          helm template lernplattform Lernplattform/deployment/helm/lernplattform \
            --namespace lernplattform \
            > /tmp/lernplattform-hpa.yaml
          test -s /tmp/lernplattform-hpa.yaml

      - name: Chart ohne HPA rendern
        run: |
          helm template lernplattform Lernplattform/deployment/helm/lernplattform \
            --namespace lernplattform \
            --set backend.autoscaling.enabled=false \
            --set backend.replicaCount=1 \
            > /tmp/lernplattform-static.yaml
          test -s /tmp/lernplattform-static.yaml
