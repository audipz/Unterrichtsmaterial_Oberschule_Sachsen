name: Build Unterrichtsmaterialien

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "Ausgabe/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build-Werkzeuge installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-xetex \
            texlive-latex-recommended \
            fonts-dejavu-core \
            python3-docx

      - name: Skripte ausführbar machen
        run: |
          chmod +x Build/*.sh

      - name: Dokumente bauen
        run: |
          ./Build/build.sh

      - name: Veröffentlichungsartefakte zusammenstellen
        run: |
          ./Build/package_artifacts.sh

      - name: Build-Ausgabe in aktuellen Branch übernehmen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Ausgabe/ ist lokal absichtlich ignoriert. Nur der reproduzierbare
          # GitHub-Build darf die generierten Dateien in Git aufnehmen.
          git add -f Ausgabe/

          if git diff --cached --quiet; then
            echo "Keine Änderungen in Ausgabe/"
            exit 0
          fi

          git commit -m "Build-Ausgabe aktualisieren [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
