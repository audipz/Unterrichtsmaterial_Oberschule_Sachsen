name: Build Unterrichtsmaterialien

on:
  push:
    branches:
      - main
    paths-ignore:
      - "Ausgabe/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-main
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build-Werkzeuge installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex fonts-dejavu-core

      - name: Skripte ausführbar machen
        run: |
          chmod +x Build/*.sh

      - name: Dokumente bauen
        run: |
          ./Build/build.sh

      - name: Veröffentlichungsartefakte zusammenstellen
        run: |
          ./Build/package_artifacts.sh

      - name: Schülerunterlagen bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Schuelerunterlagen-Klassen-7-10
          path: .publish/Schueler
          if-no-files-found: error
          retention-days: 90

      - name: Lehrerunterlagen bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Lehrerunterlagen-Klassen-7-10
          path: .publish/Lehrer
          if-no-files-found: error
          retention-days: 90
