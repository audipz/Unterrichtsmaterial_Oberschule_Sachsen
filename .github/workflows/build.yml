name: Dokumentexport

on:
  workflow_dispatch:
    inputs:
      export_profile:
        description: "Name unter Build/export-manifests, z. B. complete, teacher oder student"
        required: true
        type: string
        default: complete
      publish_release:
        description: "Auf main das Release aktualisieren"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: document-export-${{ github.ref }}-${{ inputs.export_profile }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Exportprofil validieren
        env:
          EXPORT_PROFILE: ${{ inputs.export_profile }}
        run: |
          set -euo pipefail
          [[ "$EXPORT_PROFILE" =~ ^[a-z0-9][a-z0-9._-]*$ ]] || { echo "Ungültiger Profilname." >&2; exit 1; }
          [[ -f "Build/export-manifests/${EXPORT_PROFILE}.json" ]] || { echo "Exportprofil nicht gefunden: $EXPORT_PROFILE" >&2; exit 1; }
          python3 Build/validate_exports.py

      - name: Build-Werkzeuge installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-xetex \
            texlive-latex-recommended \
            fonts-dejavu-core \
            librsvg2-bin \
            python3-docx

      - name: Skripte ausführbar machen
        run: chmod +x Build/*.sh Build/*.py

      - name: Dokumente erzeugen und Export paketieren
        env:
          EXPORT_PROFILE: ${{ inputs.export_profile }}
        run: python3 Build/run_export.py "Build/export-manifests/${EXPORT_PROFILE}.json"

      - name: Export als Actions-Artefakt bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: document-export-${{ inputs.export_profile }}
          path: .publish/*.zip
          if-no-files-found: error
          compression-level: 0

      - name: Release aktualisieren
        if: ${{ inputs.publish_release && github.ref_name == 'main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXPORT_PROFILE: ${{ inputs.export_profile }}
        run: |
          set -euo pipefail
          ZIP="$(find .publish -maxdepth 1 -type f -name '*.zip' -print -quit)"
          [[ -n "$ZIP" && -s "$ZIP" ]] || { echo "Kein Export-ZIP gefunden." >&2; exit 1; }

          TAG="unterrichtsmaterial-${EXPORT_PROFILE}-aktuell"
          TITLE="Unterrichtsmaterialien – ${EXPORT_PROFILE}"
          NOTES="Manifestgesteuerter Dokumentexport aus main. Build-Commit: ${GITHUB_SHA}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" "$ZIP" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA"
          fi

      - name: Zusammenfassung
        run: |
          echo "Exportprofil: ${{ inputs.export_profile }}"
          echo "Dokumente werden nicht in Git eingecheckt."
          echo "Normale Pushes starten keinen Dokumentexport mehr."
