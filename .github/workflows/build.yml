name: Build Unterrichtsmaterialien

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "Ausgabe/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build-Werkzeuge installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-xetex \
            texlive-latex-recommended \
            fonts-dejavu-core \
            librsvg2-bin \
            python3-docx \
            zip

      - name: Skripte ausführbar machen
        run: |
          chmod +x Build/*.sh

      - name: Dokumente bauen
        run: |
          ./Build/build.sh

      - name: Veröffentlichungsartefakte zusammenstellen
        run: |
          ./Build/package_artifacts.sh

      - name: Vollständige Ausgabe als Actions-Artefakt bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Unterrichtsmaterial_Oberschule_Sachsen
          path: .publish/Unterrichtsmaterial_Oberschule_Sachsen.zip
          if-no-files-found: error
          compression-level: 0

      - name: Öffentliches ZIP-Release aktualisieren
        if: ${{ github.ref_name == 'main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="unterrichtsmaterial-aktuell"
          ZIP=".publish/Unterrichtsmaterial_Oberschule_Sachsen.zip"
          TITLE="Aktuelle Unterrichtsmaterialien"
          NOTES="Automatisch erzeugte Gesamtausgabe aus main. Build-Commit: ${GITHUB_SHA}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" "$ZIP" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA" \
              --latest
          fi

          echo "Öffentlicher Download: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/Unterrichtsmaterial_Oberschule_Sachsen.zip"

      - name: Build-Ausgabe nicht versionieren
        if: ${{ github.ref_name != 'main' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Bereits versionierte Build-Ausgabe einmalig aus Git entfernen.
          # Die Dateien bleiben lokal für Packaging/Prüfung erhalten.
          if git ls-files --error-unmatch Ausgabe >/dev/null 2>&1 || git ls-files Ausgabe | grep -q .; then
            git rm -r --cached Ausgabe/
            git commit -m "Generierte Build-Ausgabe aus Git entfernen [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Ausgabe/ ist nicht mehr versioniert."
          fi

      - name: Build abgeschlossen
        run: |
          echo "Build erfolgreich. Ausgabe/ wird nicht in Git eingecheckt."
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "Das öffentliche Release-ZIP wurde aktualisiert."
          else
            echo "In Feature-Branches steht das ZIP als Actions-Artefakt zur Build-Prüfung bereit."
          fi
