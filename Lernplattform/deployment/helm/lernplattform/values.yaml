backend:
  image:
    repository: lernplattform-backend
    tag: dev
    pullPolicy: IfNotPresent
  replicaCount: 1
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  service:
    port: 8080
  probes:
    startup:
      failureThreshold: 30
      periodSeconds: 2
    readiness:
      initialDelaySeconds: 0
      periodSeconds: 5
    liveness:
      initialDelaySeconds: 0
      periodSeconds: 10
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

frontend:
  image:
    repository: lernplattform-frontend
    tag: dev
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    port: 80

ingress:
  enabled: true
  className: traefik
  host: lernplattform.local
  tls:
    enabled: false
    secretName: ""

database:
  existingSecret: lernplattform-database
  urlKey: url
  usernameKey: username
  passwordKey: password

systemAdmin:
  bootstrap:
    enabled: true
    existingSecret: lernplattform-system-admin
    usernameKey: username
    passwordKey: password

migration:
  enabled: true
  backoffLimit: 1
  activeDeadlineSeconds: 300
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

backup:
  enabled: true
  schedule: "0 2 * * *"
  existingSecret: lernplattform-backup
  retention:
    daily: 7
    weekly: 4
    monthly: 12

storage:
  existingSecret: lernplattform-storage

resources: {}
