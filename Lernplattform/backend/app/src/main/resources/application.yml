spring:
  application:
    name: lernplattform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lernplattform}
    username: ${DB_USERNAME:lernplattform}
    password: ${DB_PASSWORD:lernplattform}
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
