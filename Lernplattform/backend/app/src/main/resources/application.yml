spring:
  application:
    name: lernplattform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lernplattform}
    username: ${DB_USERNAME:lernplattform}
    password: ${DB_PASSWORD:lernplattform}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
